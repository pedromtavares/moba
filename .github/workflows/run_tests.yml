name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

jobs:
  run-tests:
    runs-on: ubuntu-latest
    environment: test
    services:
      postgres:
        image: postgres:12
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.16.2'
          otp-version: '26.2.4'
      - run: mix deps.get
      - run: mix deps.compile
      - run: npm ci --prefix assets
      - run: npm audit --package-lock-only --prefix assets
      - run: npm run deploy --prefix assets
      - run: mix seed_test
        env:
          MIX_ENV: test
