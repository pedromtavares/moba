version: 2
updates:
  - package-ecosystem: npm
    directory: /assets
    schedule:
      interval: weekly
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-compatible:
        update-types: [minor, patch]
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
